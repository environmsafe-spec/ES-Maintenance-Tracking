// Append a permanent, dated record of a service that was performed.
// This is the audit trail — the maintenance doc only holds the LATEST baseline.
async function logServicePerformed(genId, entries, customFields){
  // entries: [{ kind:'time'|'hours', key, label, date, hoursAtService, by, backfilled }]
  try{
    const batch = db.batch ? null : null; // simple sequential adds (small counts)
    for(const e of entries){
      await db.collection(SVCLOG_COLLECTION).add({
        genId,
        kind: e.kind,
        intervalKey: String(e.key),
        intervalLabel: e.label,
        date: e.date,
        hoursAtService: (e.hoursAtService===undefined || e.hoursAtService==='') ? null : e.hoursAtService,
        by: e.by || '',
        backfilled: !!e.backfilled,
        customFields: customFields || {},
        savedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    return true;
  }catch(err){
    console.warn('service log write failed', err);
    return false; // non-fatal: the schedule baseline still saved
  }
}

async function saveMaintDoc(genId, patch){  // merge patch into the maintenance doc for this generator
  try{
    await db.collection(MAINT_COLLECTION).doc(genId).set(patch, { merge:true });
    return true;
  }catch(e){
    console.warn('maint save failed', e);
    showToast(t('maint_fail'));
    return false;
  }
}

function bindMaintenance(){
  document.querySelectorAll('[data-mgen]').forEach(chip=>{
    chip.addEventListener('click', ()=>{ STATE.maintGenId = chip.dataset.mgen; render(); });
  });

  const hpd = document.getElementById('m-hrsperday');
  if(hpd) hpd.addEventListener('change', async ()=>{
    const val = hpd.value==='' ? null : parseFloat(hpd.value);
    await saveMaintDoc(STATE.maintGenId, { hrsPerDay: val });
  });

  const tech = (()=>{ try{ return localStorage.getItem(TECH_LOCAL_KEY) || ''; }catch(e){ return ''; } })();

  document.querySelectorAll('[data-mdone-time]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.dataset.mdoneTime;
      const iv = TIME_INTERVALS.find(x=>x.key===key);
      const label = STATE.lang==='ar' ? iv.labelAr : iv.labelEn;
      if(!confirm(t('maint_done_confirm',{name:label}))) return;
      const cf = promptCustomFieldValues('service');
      const today = new Date(); today.setMinutes(today.getMinutes()-today.getTimezoneOffset());
      const iso = today.toISOString().slice(0,10);
      const curH = latestHoursFor(STATE.maintGenId);
      const ok = await saveMaintDoc(STATE.maintGenId, { time: { [key]: { lastDone: iso, by: tech } } });
      if(ok){
        await logServicePerformed(STATE.maintGenId, [{ kind:'time', key, label, date: iso, hoursAtService: curH, by: tech }], cf);
        showToast(t('maint_done_toast'));
      }
    });
  });

  document.querySelectorAll('[data-mdone-hr]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const hi = parseInt(btn.dataset.mdoneHr,10);
      const cur = latestHoursFor(STATE.maintGenId);
      const smaller = smallerHourIntervals(hi);
      // Nesting: a larger service includes all smaller ones — confirm and reset them together.
      let msg = t('maint_done_confirm',{name:hi+' hr'});
      if(smaller.length) msg += '\n\n' + t('maint_nest_note');
      if(!confirm(msg)) return;
      const cf = promptCustomFieldValues('service');
      const today = new Date(); today.setMinutes(today.getMinutes()-today.getTimezoneOffset());
      const iso = today.toISOString().slice(0,10);
      const doneAt = cur!==null ? cur : 0;
      const patch = { hours: {} };
      [hi, ...smaller].forEach(k=>{
        patch.hours[String(k)] = { doneAtHrs: doneAt, date: iso, by: tech };
      });
      const ok = await saveMaintDoc(STATE.maintGenId, patch);
      if(ok){
        await logServicePerformed(STATE.maintGenId,
          [hi, ...smaller].map(k=>({ kind:'hours', key:k, label:k+' hr', date: iso, hoursAtService: doneAt, by: tech })), cf);
        showToast(smaller.length ? t('maint_nest_done',{n:1+smaller.length}) : t('maint_done_toast'));
      }
    });
  });

  // --- Manual baseline entry: last service DATE + HOURS ---
  document.querySelectorAll('[data-medit-time]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.dataset.meditTime;
      const iv = TIME_INTERVALS.find(x=>x.key===key);
      const label = STATE.lang==='ar' ? iv.labelAr : iv.labelEn;
      const m = maintDocFor(STATE.maintGenId) || {};
      const existing = (m.time||{})[key] || {};
      const dIn = prompt(t('maint_edit_date_prompt',{name:label}), existing.lastDone || '');
      if(dIn===null) return;
      const dStr = dIn.trim();
      if(!/^\d{4}-\d{2}-\d{2}$/.test(dStr) || isNaN(new Date(dStr+'T00:00:00').getTime())){
        showToast(t('maint_bad_date')); return;
      }
      const hIn = prompt(t('maint_edit_hrs_prompt',{name:label}), (existing.doneAtHrs!==undefined&&existing.doneAtHrs!==null)?existing.doneAtHrs:'');
      if(hIn===null) return;
      const hStr = hIn.trim();
      let hVal = null;
      if(hStr!==''){
        hVal = parseFloat(hStr);
        if(isNaN(hVal) || hVal<0){ showToast(t('maint_bad_hrs')); return; }
      }
      const cf = promptCustomFieldValues('service');
      const ok = await saveMaintDoc(STATE.maintGenId, { time: { [key]: { lastDone: dStr, doneAtHrs: hVal, by: tech } } });
      if(ok){
        await logServicePerformed(STATE.maintGenId, [{ kind:'time', key, label, date: dStr, hoursAtService: hVal, by: tech, backfilled:true }], cf);
        showToast(t('maint_saved'));
      }
    });
  });

  document.querySelectorAll('[data-svcdel]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm(t('svc_delete_confirm'))) return;
      try{
        await db.collection(SVCLOG_COLLECTION).doc(btn.dataset.svcdel).delete();
        showToast(t('svc_deleted'));
      }catch(e){ console.warn(e); showToast(t('maint_fail')); }
    });
  });

  document.querySelectorAll('[data-medit-hr]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const hi = btn.dataset.meditHr;
      const m = maintDocFor(STATE.maintGenId) || {};
      const existing = (m.hours||{})[String(hi)] || {};
      const label = hi + ' hr';
      const hIn = prompt(t('maint_edit_hrs_prompt',{name:label}), (existing.doneAtHrs!==undefined&&existing.doneAtHrs!==null)?existing.doneAtHrs:'');
      if(hIn===null) return;
      const hVal = parseFloat(String(hIn).trim());
      if(isNaN(hVal) || hVal<0){ showToast(t('maint_bad_hrs')); return; }
      const dIn = prompt(t('maint_edit_date_prompt',{name:label}), existing.date || '');
      if(dIn===null) return;
      const dStr = String(dIn).trim();
      if(dStr!=='' && (!/^\d{4}-\d{2}-\d{2}$/.test(dStr) || isNaN(new Date(dStr+'T00:00:00').getTime()))){
        showToast(t('maint_bad_date')); return;
      }
      const cf = dStr ? promptCustomFieldValues('service') : {};
      const ok = await saveMaintDoc(STATE.maintGenId, { hours: { [String(hi)]: { doneAtHrs: hVal, date: dStr||null, by: tech } } });
      if(ok){
        if(dStr) await logServicePerformed(STATE.maintGenId, [{ kind:'hours', key:hi, label:label, date: dStr, hoursAtService: hVal, by: tech, backfilled:true }], cf);
        showToast(t('maint_saved'));
      }
    });
  });
}

/* ================= CORRECTIVE MAINTENANCE (faults / repairs) ================= */
// Doc shape: { genId, date(ISO), type, severity, status, hoursAtEvent,
//              description, actionTaken, partsUsed, downtimeHrs, cost, by, closedDate, savedAt }

function corrLabel(kind, value){
  return t('corr_' + kind + '_' + value) || value;
}
function corrTypeLabel(v){ return t('corr_t_' + v); }
function corrSevLabel(v){ return t('corr_s_' + v); }
function corrStatusLabel(v){ return t('corr_st_' + v); }

function sevClass(sev){
  if(sev==='critical') return 'sev-critical';
  if(sev==='high') return 'sev-high';
  if(sev==='medium') return 'sev-medium';
  return 'sev-low';
}
function correctiveFor(genId){
  return STATE.corrective
    .filter(c => !genId || c.genId===genId)
    .sort((a,b)=> String(b.date||'').localeCompare(String(a.date||'')));
}
function openFaultCount(){
  return STATE.corrective.filter(c => c.status && c.status!=='closed').length;
}

// Serial fault IDs: "Cor-813", "Cor-814", ... Derived from the highest faultSeq already
// saved (live-synced via STATE.corrective), so no separate counter doc or transaction is
// needed — simplest thing that works correctly for this app's single-technician workflow.
const FAULT_ID_PREFIX = 'Cor-';
const FAULT_ID_START = 813;

function nextFaultSeq(){
  const nums = STATE.corrective.map(c=>c.faultSeq).filter(n=>typeof n==='number' && !isNaN(n));
  return nums.length ? Math.max(...nums)+1 : FAULT_ID_START;
}

function faultsWithoutId(){
  return STATE.corrective.filter(c => typeof c.faultSeq !== 'number' || isNaN(c.faultSeq));
}

// One-time, user-triggered backfill for faults saved before Fault IDs existed. Assigns IDs
// in chronological order (oldest first) so numbering still reads sensibly, starting from
// whatever nextFaultSeq() already is — never reassigns a fault that already has an ID.
async function backfillFaultIds(){
  const missing = faultsWithoutId().slice().sort((a,b)=>{
    const d = String(a.date||'').localeCompare(String(b.date||''));
    return d !== 0 ? d : String(a.id).localeCompare(String(b.id));
  });
  let seq = nextFaultSeq();
  let okCount = 0;
  for(const c of missing){
    try{
      await db.collection(CORR_COLLECTION).doc(c.id).update({ faultSeq: seq, faultId: FAULT_ID_PREFIX + seq });
      seq++; okCount++;
    }catch(e){ console.warn('fault id backfill failed for', c.id, e); }
  }
  return okCount;
}

// Wires the add-item strip + line removal for one fault form.
function bindFaultBillingBlock(prefix, getLines, setLines){
  bindAddItemForm(prefix+'add', line=>{
    setLines(getLines().concat([line]));
    rerenderPreservingCorrForm();
    ['-pick','-name','-qty','-price'].forEach(sfx=>{
      const e = document.getElementById(prefix+'add'+sfx);
      if(e) e.value = sfx==='-qty' ? '1' : '';
    });
  });
  document.querySelectorAll(`[data-linerm^="${prefix}line:"]`).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.linerm.split(':')[1], 10);
      setLines(getLines().filter((_,i)=>i!==idx));
      rerenderPreservingCorrForm();
    });
  });
  document.querySelectorAll(`[data-lineqty^="${prefix}line:"], [data-lineprice^="${prefix}line:"]`).forEach(el=>{
    const isQty = el.hasAttribute('data-lineqty');
    const idx = parseInt((isQty ? el.dataset.lineqty : el.dataset.lineprice).split(':')[1], 10);
    el.addEventListener('change', ()=>{
      const next = getLines().map((l,i)=>{
        if(i!==idx) return l;
        const v = String(el.value||'').trim()==='' ? 0 : round2(parseFloat(el.value)||0);
        const patched = Object.assign({}, l, isQty ? { qty: v } : { unitPrice: v });
        patched.total = lineTotal(patched);
        return patched;
      });
      setLines(next);
      rerenderPreservingCorrForm();
    });
  });
  const feeEl = document.getElementById(prefix+'-fee');
  if(feeEl) feeEl.addEventListener('input', ()=>{
    const raw = String(feeEl.value||'').trim();
    const v = raw==='' ? null : round2(parseFloat(raw)||0);
    if(prefix==='ce') STATE.editFaultFee = v; else STATE.newFaultFee = v;
    rerenderPreservingCorrForm();
  });
}

function bindCorrective(){
  document.querySelectorAll('[data-corrfilter]').forEach(ch=>{
    ch.addEventListener('click', ()=>{ STATE.corrFilter = ch.dataset.corrfilter; render(); });
  });

  bindFaultBillingBlock('c', ()=>STATE.newFaultLines, v=>{ STATE.newFaultLines = v; });
  if(STATE.corrEditingId){
    bindFaultBillingBlock('ce', ()=>STATE.editFaultLines||[], v=>{ STATE.editFaultLines = v; });
  }

  const backfillBtn = document.getElementById('corr-backfill-btn');
  if(backfillBtn) backfillBtn.addEventListener('click', async ()=>{
    backfillBtn.disabled = true;
    try{
      const n = await backfillFaultIds();
      showToast(t('corr_backfill_done',{n}));
    }catch(e){
      console.warn('fault id backfill failed', e);
      showToast(t('corr_fail'));
    }finally{ backfillBtn.disabled = false; }
  });

  const cPhotos = document.getElementById('c-photos');
  if(cPhotos) cPhotos.addEventListener('change', (e)=>{ addFaultPhotos(e.target.files, 'new'); });
  const cePhotos = document.getElementById('ce-photos');
  if(cePhotos) cePhotos.addEventListener('change', (e)=>{ addFaultPhotos(e.target.files, 'edit'); });

  document.querySelectorAll('[data-photorm]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [target, idxStr] = btn.dataset.photorm.split(':');
      const idx = parseInt(idxStr, 10);
      const buf = target==='new' ? STATE.newFaultPhotos : STATE.editFaultPhotos;
      if(buf) buf.splice(idx, 1);
      rerenderPreservingCorrForm();
    });
  });

  const saveBtn = document.getElementById('c-save');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    const genId = (document.getElementById('c-gen')||{}).value;
    const desc = ((document.getElementById('c-desc')||{}).value||'').trim();
    if(!genId){ showToast(t('corr_need_gen')); return; }
    if(!desc){ showToast(t('corr_need_desc')); return; }
    if(!photosFitBudget(STATE.newFaultPhotos)){ showToast(t('corr_photo_toobig')); return; }
    const val = id => { const e=document.getElementById(id); return e? String(e.value||'').trim() : ''; };
    const num = id => { const v=val(id); return v===''? null : parseFloat(v); };
    const by = val('c-by');
    if(by){ try{ localStorage.setItem(TECH_LOCAL_KEY, by); }catch(e){} }
    const faultSeq = nextFaultSeq();
    const rec = {
      genId,
      faultSeq,
      faultId: FAULT_ID_PREFIX + faultSeq,
      date: val('c-date'),
      type: val('c-type') || 'other',
      severity: val('c-sev') || 'low',
      status: val('c-status') || 'open',
      hoursAtEvent: num('c-hours'),
      shortDescription: val('c-shortdesc'),
      description: desc,
      causesOfFault: val('c-causes'),
      actionTaken: val('c-action'),
      partsUsed: val('c-parts'),
      downtimeHrs: num('c-downtime'),
      by,
      recommendations: val('c-recommend'),
      serviceFee: (val('c-fee')==='' ? serviceRate() : round2(parseFloat(val('c-fee'))||0)),
      partsLines: STATE.newFaultLines.map(l=>({
        itemId: l.itemId||'', name: l.name||l.desc||'', desc: l.desc||l.name||'',
        qty: parseFloat(l.qty)||0, unitPrice: round2(l.unitPrice), total: lineTotal(l)
      })),
      photos: STATE.newFaultPhotos.slice(),
      customFields: collectCustomFieldValues('corrective', 'c'),
      savedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    const dupMsg = duplicateCorrectiveWarning(rec);
    if(dupMsg && !confirm(dupMsg)) return;
    saveBtn.disabled = true;
    try{
      await db.collection(CORR_COLLECTION).add(rec);
      showToast(t('corr_saved'));
      ['c-shortdesc','c-desc','c-causes','c-action','c-parts','c-hours','c-downtime','c-recommend'].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=''; });
      STATE.newFaultPhotos = [];
      STATE.newFaultLines = [];
      STATE.newFaultFee = null;
      render();
    }catch(e){
      console.warn('corrective save failed', e);
      showToast(t('corr_fail'));
    }finally{ saveBtn.disabled = false; }
  });

  document.querySelectorAll('[data-corrstatus]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.corrstatus;
      const c = STATE.corrective.find(x=>x.id===id);
      if(!c) return;
      const order = CORR_STATUS;
      const nextIdx = (order.indexOf(c.status||'open') + 1) % order.length;
      const next = order[nextIdx];
      const patch = { status: next };
      if(next==='closed'){
        const today = new Date(); today.setMinutes(today.getMinutes()-today.getTimezoneOffset());
        patch.closedDate = today.toISOString().slice(0,10);
      }
      try{
        await db.collection(CORR_COLLECTION).doc(id).update(patch);
        showToast(t('corr_saved'));
      }catch(e){ console.warn(e); showToast(t('corr_fail')); }
    });
  });

  document.querySelectorAll('[data-corrdel]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm(t('corr_del_confirm'))) return;
      try{
        await db.collection(CORR_COLLECTION).doc(btn.dataset.corrdel).delete();
        showToast(t('corr_saved'));
      }catch(e){ console.warn(e); showToast(t('corr_fail')); }
    });
  });

  document.querySelectorAll('[data-corrprint]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ printFaultReport(btn.dataset.corrprint); });
  });

  document.querySelectorAll('[data-corrword]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ exportFaultWord(btn.dataset.corrword); });
  });

  document.querySelectorAll('[data-corredit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const c = STATE.corrective.find(x=>x.id===btn.dataset.corredit);
      STATE.corrEditingId = btn.dataset.corredit;
      STATE.editFaultPhotos = (c && c.photos) ? c.photos.slice() : [];
      STATE.editFaultLines = faultPartsLines(c).map(l=>Object.assign({}, l));
      STATE.editFaultFee = faultServiceFee(c);
      render();
    });
  });

  document.querySelectorAll('[data-correditcancel]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      STATE.corrEditingId = null;
      STATE.editFaultPhotos = null;
      STATE.editFaultLines = null;
      STATE.editFaultFee = null;
      render();
    });
  });

  document.querySelectorAll('[data-correditsave]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.correditsave;
      const genId = (document.getElementById('ce-gen')||{}).value;
      const desc = ((document.getElementById('ce-desc')||{}).value||'').trim();
      if(!genId){ showToast(t('corr_need_gen')); return; }
      if(!desc){ showToast(t('corr_need_desc')); return; }
      if(!photosFitBudget(STATE.editFaultPhotos)){ showToast(t('corr_photo_toobig')); return; }
      const val = eid => { const e=document.getElementById(eid); return e? String(e.value||'').trim() : ''; };
      const num = eid => { const v=val(eid); return v===''? null : parseFloat(v); };
      const by = val('ce-by');
      if(by){ try{ localStorage.setItem(TECH_LOCAL_KEY, by); }catch(e){} }
      const patch = {
        genId,
        date: val('ce-date'),
        type: val('ce-type') || 'other',
        severity: val('ce-sev') || 'low',
        status: val('ce-status') || 'open',
        hoursAtEvent: num('ce-hours'),
        shortDescription: val('ce-shortdesc'),
        description: desc,
        causesOfFault: val('ce-causes'),
        actionTaken: val('ce-action'),
        partsUsed: val('ce-parts'),
        downtimeHrs: num('ce-downtime'),
        by,
        recommendations: val('ce-recommend'),
        serviceFee: (val('ce-fee')==='' ? serviceRate() : round2(parseFloat(val('ce-fee'))||0)),
        partsLines: (STATE.editFaultLines||[]).map(l=>({
          itemId: l.itemId||'', name: l.name||l.desc||'', desc: l.desc||l.name||'',
          qty: parseFloat(l.qty)||0, unitPrice: round2(l.unitPrice), total: lineTotal(l)
        })),
        photos: (STATE.editFaultPhotos || []).slice(),
        customFields: collectCustomFieldValues('corrective', 'ce')
      };
      if(patch.status==='closed'){
        const existing = STATE.corrective.find(x=>x.id===id);
        if(!existing || existing.status!=='closed'){
          const today = new Date(); today.setMinutes(today.getMinutes()-today.getTimezoneOffset());
          patch.closedDate = today.toISOString().slice(0,10);
        }
      }
      btn.disabled = true;
      try{
        await db.collection(CORR_COLLECTION).doc(id).update(patch);
        showToast(t('corr_updated'));
        STATE.corrEditingId = null;
        STATE.editFaultPhotos = null;
        STATE.editFaultLines = null;
        STATE.editFaultFee = null;
        render();
      }catch(e){
        console.warn('corrective update failed', e);
        showToast(t('corr_fail'));
      }finally{ btn.disabled = false; }
    });
  });
}

/* ================= BILLING CORE =================
   Three pieces work together:
     1. pricelist   — the goods catalogue (Setup tab). Prices can always be overridden,
                      and an item that is not on the list can be typed straight in.
     2. billable    — every fault carries a service fee + its own goods lines;
                      every service VISIT (one generator on one date, however many
                      intervals were ticked off) carries one service fee.
     3. invoices    — pick the un-invoiced work, add any extra goods (including stock
                      supply that was never used on a repair), then follow up payment.
   "Already invoiced" is derived from the invoice lines themselves (sourceType+sourceId),
   so nothing has to be written back onto a fault and the two can never drift apart. */

function billingCurrency(){ return STATE.billing.currency || DEFAULT_CURRENCY; }

function serviceRate(){
  const r = parseFloat(STATE.billing.serviceRate);
  return (isNaN(r) || r < 0) ? DEFAULT_SERVICE_RATE : r;
}

// Routine/preventive visits are charged at their own (much lower) contract rate.
function routineRate(){
  const r = parseFloat(STATE.billing.routineRate);
  return (isNaN(r) || r < 0) ? DEFAULT_ROUTINE_RATE : r;
}

function bankAccounts(){
  const b = STATE.billing || {};
  return [
    { name: b.bank1Name || '', acct: b.bank1Acct || '' },
    { name: b.bank2Name || '', acct: b.bank2Acct || '' }
  ].filter(x=>x.name || x.acct);
}

function round2(n){
  const v = Math.round(((Number(n) || 0) + Number.EPSILON) * 100) / 100;
  return Object.is(v, -0) ? 0 : v;
}
function moneyNum(n){ return round2(n).toFixed(2); }
function money(n){ return moneyNum(n) + ' ' + billingCurrency(); }

/* ---- price list ---- */
function priceItemLabel(item){
  if(!item) return '';
  return STATE.lang==='ar' ? (item.nameAr || item.nameEn || '') : (item.nameEn || item.nameAr || '');
}
function priceItemById(id){ return STATE.pricelist.find(i=>i.id===id) || null; }
function activePriceItems(){
  return STATE.pricelist.filter(i=>i.active!==false)
    .slice().sort((a,b)=>priceItemLabel(a).localeCompare(priceItemLabel(b)));
}

/* ---- invoice line helpers ---- */
function lineTotal(l){
  const q = parseFloat(l && l.qty); const p = parseFloat(l && l.unitPrice);
  return round2((isNaN(q)?0:q) * (isNaN(p)?0:p));
}
function linesSubtotal(lines){
  return round2((lines||[]).reduce((s,l)=>s + lineTotal(l), 0));
}

/* ---- what a fault is worth ---- */
function faultServiceFee(c){
  if(!c) return 0;
  if(c.serviceFee===undefined || c.serviceFee===null || c.serviceFee==='') return serviceRate();
  const v = parseFloat(c.serviceFee);
  return isNaN(v) ? serviceRate() : v;
}
function faultPartsLines(c){
  return (c && Array.isArray(c.partsLines)) ? c.partsLines : [];
}
function faultBillableTotal(c){
  return round2(faultServiceFee(c) + linesSubtotal(faultPartsLines(c)));
}

/* ---- what a service visit is worth ----
   Nesting means one visit can write several servicelog rows (500 h also clears 250 and 125).
   That is ONE visit, so it is billed once: rows are grouped by generator + date. */
function serviceVisits(){
  const byKey = {};
  (STATE.svclog||[]).forEach(s=>{
    if(!s.genId || !s.date) return;
    const key = s.genId + '|' + s.date;
    if(!byKey[key]) byKey[key] = { key, genId: s.genId, date: s.date, by: s.by || '', labels: [], rows: [] };
    if(s.intervalLabel && byKey[key].labels.indexOf(s.intervalLabel) === -1) byKey[key].labels.push(s.intervalLabel);
    if(!byKey[key].by && s.by) byKey[key].by = s.by;
    byKey[key].rows.push(s);
  });
  return Object.keys(byKey).map(k=>byKey[k]).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}

/* ---- has this job been billed already? (derived from the invoices themselves) ---- */
function invoicedSourceKeys(exceptInvoiceId){
  const set = {};
  (STATE.invoices||[]).forEach(inv=>{
    if(inv.status==='cancelled') return;
    if(exceptInvoiceId && inv.id===exceptInvoiceId) return;
    (inv.lines||[]).forEach(l=>{
      if(l && l.sourceType && l.sourceType!=='manual' && l.sourceId) set[l.sourceType+':'+l.sourceId] = inv;
    });
  });
  return set;
}
function invoiceForSource(sourceType, sourceId, exceptInvoiceId){
  return invoicedSourceKeys(exceptInvoiceId)[sourceType+':'+sourceId] || null;
}

/* ---- the pickable work list for one client ---- */
function billableWorkItems(client, exceptInvoiceId){
  const done = invoicedSourceKeys(exceptInvoiceId);
  const items = [];

  (STATE.corrective||[]).forEach(c=>{
    const g = genById(c.genId);
    if(client && (!g || g.client !== client)) return;
    const fee = faultServiceFee(c);
    const parts = faultPartsLines(c);
    items.push({
      sourceType:'fault', sourceId:c.id, ref: c.faultId || '',
      date: c.date || '', genId: c.genId, genName: g ? g.name : '—',
      title: c.shortDescription || c.description || '',
      by: c.by || '', fee, parts,
      amount: round2(fee + linesSubtotal(parts)),
      invoicedBy: done['fault:'+c.id] || null
    });
  });

  serviceVisits().forEach(v=>{
    const g = genById(v.genId);
    if(client && (!g || g.client !== client)) return;
    const fee = routineRate();
    items.push({
      sourceType:'service', sourceId: v.key, ref: '',
      date: v.date, genId: v.genId, genName: g ? g.name : '—',
      title: v.labels.join(' · '),
      by: v.by, fee, parts: [],
      amount: round2(fee),
      invoicedBy: done['service:'+v.key] || null
    });
  });

  return items.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}

/* ---- turn a picked job into invoice lines ---- */
function linesFromWorkItem(w){
  const lines = [];
  const what = w.sourceType==='fault' ? t('inv_line_from_fault') : t('inv_line_from_service');
  const detail = [w.genName, w.ref || w.title].filter(Boolean).join(' — ');
  lines.push({
    kind:'service', sourceType:w.sourceType, sourceId:w.sourceId, ref:w.ref || '',
    genId: w.genId || '', genName: w.genName || '',
    desc: what + (detail ? ' — ' + detail : ''),
    qty: 1, unitPrice: round2(w.fee), total: round2(w.fee)
  });
  (w.parts||[]).forEach(p=>{
    lines.push({
      kind:'good', sourceType:w.sourceType, sourceId:w.sourceId, ref:w.ref || '',
      genId: w.genId || '', genName: w.genName || '',
      desc: p.name || '', qty: (parseFloat(p.qty)||0), unitPrice: round2(p.unitPrice),
      total: lineTotal(p)
    });
  });
  return lines;
}

/* ---- how an invoice is ISSUED: scope (services / goods / both) and detail level ----
   These only shape the DOCUMENT. The stored invoice always keeps every line, so its own
   total never changes and no record is ever lost. A scoped document prints its own
   subtotal for the part being issued. */
function scopeLines(lines, scope){
  const ls = lines || [];
  if(scope==='services') return ls.filter(l=>l.kind==='service');
  if(scope==='goods')    return ls.filter(l=>l.kind!=='service');
  return ls.slice();
}

// Summary mode: no per-fault detail. Each generator gets one line for its corrective
// visits and one for its routine visits, carrying the TOTAL QUANTITY for the period.
// Lines are grouped by unit price too, so a mixed rate can never distort the total.
function summariseLines(lines){
  const groups = [];
  const index = {};
  (lines||[]).forEach(l=>{
    const isService = l.kind==='service';
    const gname = l.genName || '';
    const key = [isService?'s':'g', l.genId||'', isService?(l.sourceType||''):(l.desc||''), round2(l.unitPrice)].join('|');
    if(!index[key]){
      let desc;
      if(isService){
        const what = l.sourceType==='service' ? t('inv_sum_routine') : t('inv_sum_corrective');
        desc = gname ? (gname + ' — ' + what) : what;
      }else{
        desc = (l.desc||'') + (gname ? ' — ' + gname : '');
      }
      index[key] = { kind: l.kind, sourceType: l.sourceType, genId: l.genId||'', genName: gname,
                     desc, qty: 0, unitPrice: round2(l.unitPrice), total: 0, ref: '' };
      groups.push(index[key]);
    }
    const g = index[key];
    g.qty = round2(g.qty + (parseFloat(l.qty)||0));
    g.total = round2(g.total + lineTotal(l));
  });
  // services first, then goods; within each, by generator name
  return groups.sort((a,b)=>{
    if((a.kind==='service') !== (b.kind==='service')) return a.kind==='service' ? -1 : 1;
    return String(a.genName||a.desc).localeCompare(String(b.genName||b.desc));
  });
}

// The lines that a document actually prints, for a given scope + detail level.
function documentLines(inv, scope, detail){
  const scoped = scopeLines(inv && inv.lines, scope || 'all');
  return (detail==='summary') ? summariseLines(scoped) : scoped;
}

// Totals for the printed document. When the whole invoice is issued these match the
// stored totals exactly (discount and payments included); a partial scope prints only
// its own subtotal and does not pretend to carry the discount or the payment.
function documentTotals(inv, scope, detail){
  const lines = documentLines(inv, scope, detail);
  const subtotal = linesSubtotal(lines);
  const full = invoiceTotals(inv);
  const partial = (scope && scope !== 'all');
  if(!partial) return Object.assign({}, full, { subtotal, partial: false });
  return { subtotal, discount: 0, total: subtotal, paid: 0, balance: subtotal, partial: true };
}

function invScopeLabel(v){ return t('inv_scope_' + (v||'all')); }
function invDetailLabel(v){ return t('inv_detail_' + (v||'detailed')); }

/* ---- invoice numbering & totals ---- */
function nextInvoiceSeq(){
  const nums = (STATE.invoices||[]).map(i=>i.invoiceSeq).filter(n=>typeof n==='number' && !isNaN(n));
  return nums.length ? Math.max.apply(null, nums) + 1 : INVOICE_ID_START;
}

function invoiceTotals(inv){
  const subtotal = linesSubtotal(inv && inv.lines);
  const discRaw = parseFloat(inv && inv.discount);
  const discount = isNaN(discRaw) ? 0 : round2(Math.max(0, discRaw));
  const total = round2(Math.max(0, subtotal - discount));
  const paidRaw = parseFloat(inv && inv.paidAmount);
  const paid = isNaN(paidRaw) ? 0 : round2(Math.max(0, paidRaw));
  return { subtotal, discount, total, paid, balance: round2(total - paid) };
}

function statusForPayment(inv, paid){
  const { total } = invoiceTotals(Object.assign({}, inv, { paidAmount: paid }));
  if(paid <= 0) return inv.status==='draft' ? 'draft' : 'sent';
  return paid >= total ? 'paid' : 'partly_paid';
}

function invoiceIsOverdue(inv){
  if(!inv || !inv.dueDate) return false;
  if(inv.status==='paid' || inv.status==='cancelled') return false;
  if(invoiceTotals(inv).balance <= 0) return false;
  return inv.dueDate < todayStr();
}

function invoiceSummary(){
  let invoiced = 0, paid = 0;
  (STATE.invoices||[]).forEach(inv=>{
    if(inv.status==='cancelled') return;
    const tt = invoiceTotals(inv);
    invoiced += tt.total; paid += tt.paid;
  });
  invoiced = round2(invoiced); paid = round2(paid);
  return { invoiced, paid, outstanding: round2(invoiced - paid) };
}

function invStatusLabel(v){ return t('inv_st_' + (v || 'draft')); }

function clientList(){
  const seen = [];
  (STATE.generators||[]).forEach(g=>{ if(g.client && seen.indexOf(g.client)===-1) seen.push(g.client); });
  (STATE.invoices||[]).forEach(i=>{ if(i.client && seen.indexOf(i.client)===-1) seen.push(i.client); });
  return seen;
}

function invoicesSorted(){
  return (STATE.invoices||[]).slice().sort((a,b)=>{
    const d = String(b.date||'').localeCompare(String(a.date||''));
    return d !== 0 ? d : (b.invoiceSeq||0) - (a.invoiceSeq||0);
  });
}

/* ================= BILLING: draft handling ================= */
function blankInvoiceDraft(){
  const clients = clientList();
  return {
    id: null, client: clients[0] || '', genId: '', date: todayStr(), dueDate: '',
    ref: '', orderNo: '', contractNo: '', serialNo: '',
    notes: '', lines: [], discount: 0, status: 'draft', paidAmount: 0, paidDate: ''
  };
}

function currentInvDraft(){
  if(!STATE.invDraft) STATE.invDraft = blankInvoiceDraft();
  return STATE.invDraft;
}

function draftHasSource(draft, sourceType, sourceId){
  return (draft.lines||[]).some(l=>l.sourceType===sourceType && l.sourceId===sourceId);
}

function toggleWorkItemInDraft(w){
  const d = currentInvDraft();
  if(draftHasSource(d, w.sourceType, w.sourceId)){
    d.lines = d.lines.filter(l=>!(l.sourceType===w.sourceType && l.sourceId===w.sourceId));
  }else{
    d.lines = d.lines.concat(linesFromWorkItem(w));
  }
}

// Read every builder input back into the draft BEFORE re-rendering, otherwise ticking a
// checkbox would wipe whatever the user had already typed (same trap as the Faults form).
function syncInvDraftFromForm(){
  const d = currentInvDraft();
  const get = id => { const e = document.getElementById(id); return e ? String(e.value==null?'':e.value) : null; };
  const setIf = (id, key, asNumber) => {
    const v = get(id);
    if(v===null) return;
    d[key] = asNumber ? (v.trim()==='' ? 0 : (parseFloat(v)||0)) : v;
  };
  setIf('inv-client','client'); setIf('inv-gen','genId'); setIf('inv-date','date');
  setIf('inv-duedate','dueDate'); setIf('inv-ref','ref'); setIf('inv-notes','notes');
  setIf('inv-orderno','orderNo'); setIf('inv-contractno','contractNo'); setIf('inv-serialno','serialNo');
  setIf('inv-status','status'); setIf('inv-discount','discount', true);
  setIf('inv-paid','paidAmount', true); setIf('inv-paiddate','paidDate');
  return d;
}

/* ================= BILLABLE LINE EDITOR (shared by Faults + Invoices) ================= */
// Renders an editable goods table. `prefix` namespaces the remove buttons.
function renderLineEditor(lines, prefix, opts){
  opts = opts || {};
  if(!lines || !lines.length) return `<div class="line-empty">${opts.emptyText || '—'}</div>`;
  const editable = !opts.readOnly && opts.editable;
  const rows = lines.map((l,i)=>`
    <tr class="${l.kind==='service'?'line-service':''}">
      <td>${escHtml(l.desc||'')}${l.ref?`<span class="line-ref">${escHtml(l.ref)}</span>`:''}</td>
      <td class="num">${editable
        ? `<input class="cell-in" type="number" step="0.01" min="0" value="${parseFloat(l.qty)||0}" data-lineqty="${prefix}:${i}">`
        : (parseFloat(l.qty)||0)}</td>
      <td class="num">${editable
        ? `<input class="cell-in" type="number" step="0.01" min="0" value="${round2(l.unitPrice)}" data-lineprice="${prefix}:${i}">`
        : `<span class="money">${moneyNum(l.unitPrice)}</span>`}</td>
      <td class="num"><span class="money">${moneyNum(lineTotal(l))}</span></td>
      ${opts.readOnly?'':`<td class="num"><button type="button" class="line-rm" data-linerm="${prefix}:${i}" aria-label="remove">✕</button></td>`}
    </tr>`).join('');
  return `<table class="linetable">
    <thead><tr>
      <th>${t('inv_line_desc')}</th><th class="num">${t('inv_line_qty')}</th>
      <th class="num">${t('inv_line_price')}</th><th class="num">${t('inv_line_total')}</th>
      ${opts.readOnly?'':'<th></th>'}
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// The "add an item" strip: price-list dropdown OR a free-typed item, qty, price.
function renderAddItemForm(prefix){
  const opts = activePriceItems()
    .map(i=>`<option value="${i.id}">${escHtml(priceItemLabel(i))} — ${moneyNum(i.unitPrice)}</option>`).join('');
  return `
    <label>${t('inv_item')}</label>
    <select id="${prefix}-pick">
      <option value="">${t('inv_custom_item')}</option>
      ${opts}
    </select>
    <input type="text" id="${prefix}-name" placeholder="${t('inv_custom_item')}" style="margin-top:6px;">
    <div class="grid2">
      <div><label>${t('inv_qty')}</label><input type="number" step="0.01" min="0" id="${prefix}-qty" value="1"></div>
      <div><label>${t('inv_unit_price')} (${billingCurrency()})</label><input type="number" step="0.01" min="0" id="${prefix}-price" placeholder="0.00"></div>
    </div>
    <button type="button" class="btn btn-outline btn-sm" id="${prefix}-add" style="margin-top:8px;">${t('inv_add_line')}</button>`;
}

// Wires one add-item strip. onAdd(line) receives the built line; the caller re-renders.
function bindAddItemForm(prefix, onAdd){
  const pick = document.getElementById(prefix+'-pick');
  const nameEl = document.getElementById(prefix+'-name');
  const priceEl = document.getElementById(prefix+'-price');
  if(pick) pick.addEventListener('change', ()=>{
    const item = priceItemById(pick.value);
    if(item){
      if(nameEl){ nameEl.value = priceItemLabel(item); }
      if(priceEl){ priceEl.value = round2(item.unitPrice); }
    }else if(nameEl){ nameEl.value = ''; if(priceEl) priceEl.value = ''; }
  });
  const addBtn = document.getElementById(prefix+'-add');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    const item = pick ? priceItemById(pick.value) : null;
    const name = (nameEl && nameEl.value.trim()) || (item ? priceItemLabel(item) : '');
    if(!name){ showToast(t('inv_need_item')); return; }
    const qtyEl = document.getElementById(prefix+'-qty');
    const qty = qtyEl && qtyEl.value.trim()!=='' ? (parseFloat(qtyEl.value)||0) : 1;
    const priceRaw = priceEl ? priceEl.value.trim() : '';
    if(priceRaw===''){ showToast(t('inv_need_price')); return; }
    const unitPrice = round2(parseFloat(priceRaw)||0);
    onAdd({
      kind:'good', sourceType:'manual', sourceId:'', ref:'',
      itemId: item ? item.id : '', desc: name, name,
      qty, unitPrice, total: round2(qty*unitPrice)
    });
  });
}

      <div class="stat"><div class="v money">${moneyNum(sum.invoiced)}</div><div class="l">${t('inv_sum_invoiced')}</div></div>
      <div class="stat"><div class="v money" style="color:var(--ok);">${moneyNum(sum.paid)}</div><div class="l">${t('inv_sum_paid')}</div></div>
    </div>
    <div class="stat" style="margin-top:10px;">
      <div class="v money" style="color:${sum.outstanding>0?'var(--bad)':'var(--ok)'};">${moneyNum(sum.outstanding)}</div>
      <div class="l">${t('inv_sum_outstanding')} (${billingCurrency()})</div>
    </div>
  </div>`;

    <div class="genchip ${STATE.invFilter==='all'?'active':''}" data-invfilter="all">${t('inv_filter_all')}</div>
    <div class="genchip ${STATE.invFilter==='unpaid'?'active':''}" data-invfilter="unpaid">${t('inv_filter_unpaid')}</div>

  if(STATE.invFilter==='paid') list = list.filter(i=>i.status==='paid' || (i.status!=='cancelled' && invoiceTotals(i).balance <= 0));

    const tt = invoiceTotals(inv);

    const nServices = (inv.lines||[]).filter(l=>l.kind==='service').length;

    return `<div class="inv-card st-${inv.status||'draft'}">

        <div>
          <div class="inv-no">${escHtml(inv.invoiceNo||'')}</div>
          <div style="font-weight:800;font-size:13.5px;">${escHtml(inv.client||'—')}${g?` <span style="font-weight:600;color:var(--muted);font-size:12px;">· ${escHtml(g.name)}</span>`:''}</div>

            · ${nServices} ${t('inv_kind_service')} · ${nGoods} ${t('inv_kind_good')}
          </div>

        </div>

        </div>

        <div class="totrow"><span>${t('inv_total')}</span><span class="money">${money(tt.total)}</span></div>
        ${tt.paid?`<div class="totrow paidrow"><span>${t('inv_paid_amount')}</span><span class="money">${money(tt.paid)}</span></div>`:''}
        ${tt.balance>0?`<div class="totrow due"><span>${t('inv_balance')}</span><span class="money">${money(tt.balance)}</span></div>`:''}
      </div>
      ${inv.notes?`<div style="font-size:12px;margin-top:6px;color:var(--muted);white-space:pre-wrap;">${escHtml(inv.notes)}</div>`:''}

          </select>

          <label>${t('inv_detail')}</label>

      </div>

  }).join('') : `<div class="empty"><div class="em-ic">🧾</div>${t('inv_none')}</div>`;

  return `
  ${summaryCard}
  ${renderInvoiceBuilder()}
  <div class="card">
    <div class="rowbetween" style="margin-bottom:8px;"><h3 style="margin:0;">${t('inv_list')}</h3></div>
    <div class="genpicker">${chips}</div>
  </div>

}

  document.querySelectorAll('[data-invfilter]').forEach(ch=>{
    ch.addEventListener('click', ()=>{ STATE.invFilter = ch.dataset.invfilter; render(); });
  });

  // ---- builder ----
  const clientSel = document.getElementById('inv-client');
  if(clientSel) clientSel.addEventListener('change', ()=>{
    syncInvDraftFromForm();
    currentInvDraft().genId = '';
    render();
  });

  const showInv = document.getElementById('inv-showinvoiced');
  if(showInv) showInv.addEventListener('change', ()=>{
    syncInvDraftFromForm();
    STATE.invShowInvoiced = showInv.checked;
    render();
  });

  document.querySelectorAll('[data-invpick]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const d = syncInvDraftFromForm();
      const [sourceType, ...rest] = cb.dataset.invpick.split(':');
      const sourceId = rest.join(':');
      const w = billableWorkItems(d.client, d.id).find(x=>x.sourceType===sourceType && x.sourceId===sourceId);
      if(w) toggleWorkItemInDraft(w);
      render();
    });
  });

  bindAddItemForm('invadd', line=>{
    const d = syncInvDraftFromForm();
    d.lines = d.lines.concat([line]);
    render();
  });

  document.querySelectorAll('[data-linerm]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [prefix, idxRaw] = btn.dataset.linerm.split(':');
      const idx = parseInt(idxRaw, 10);
      if(prefix !== 'inv') return;
      const d = syncInvDraftFromForm();
      d.lines = d.lines.filter((_,i)=>i!==idx);
      render();
    });
  });

  document.querySelectorAll('[data-lineqty], [data-lineprice]').forEach(el=>{
    const isQty = el.hasAttribute('data-lineqty');
    const token = isQty ? el.dataset.lineqty : el.dataset.lineprice;
    const [prefix, idxRaw] = token.split(':');
    if(prefix !== 'inv') return;
    el.addEventListener('change', ()=>{
      const d = syncInvDraftFromForm();
      const line = d.lines[parseInt(idxRaw, 10)];
      if(!line) return;
      const v = String(el.value||'').trim()==='' ? 0 : round2(parseFloat(el.value)||0);
      if(isQty) line.qty = v; else line.unitPrice = v;
      line.total = lineTotal(line);
      render();
    });
  });

  ['inv-discount','inv-paid'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('change', ()=>{ syncInvDraftFromForm(); render(); });
  });

  const cancelBtn = document.getElementById('inv-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{
    STATE.invDraft = null; STATE.invEditingId = null; render();
  });

  const saveBtn = document.getElementById('inv-save');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    const d = syncInvDraftFromForm();
    if(!d.client){ showToast(t('inv_need_client')); return; }
    if(!d.lines.length){ showToast(t('inv_need_lines')); return; }
    const tt = invoiceTotals(d);
    const rec = {
      client: d.client, genId: d.genId || '', date: d.date || todayStr(),
      dueDate: d.dueDate || '', ref: d.ref || '', notes: d.notes || '',
      orderNo: d.orderNo || '', contractNo: d.contractNo || '', serialNo: d.serialNo || '',
      lines: d.lines.map(l=>({
        kind: l.kind || 'good', sourceType: l.sourceType || 'manual', sourceId: l.sourceId || '',
        ref: l.ref || '', itemId: l.itemId || '', desc: l.desc || '',
        genId: l.genId || '', genName: l.genName || '',
        qty: parseFloat(l.qty)||0, unitPrice: round2(l.unitPrice), total: lineTotal(l)
      })),
      currency: billingCurrency(),
      subtotal: tt.subtotal, discount: tt.discount, total: tt.total,
      paidAmount: tt.paid, paidDate: d.paidDate || '',
      status: d.status || 'draft',
      savedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    saveBtn.disabled = true;
    try{
      if(d.id){
        await db.collection(INVOICES_COLLECTION).doc(d.id).update(rec);
        showToast(t('inv_updated'));
      }else{
        const seq = nextInvoiceSeq();
        await db.collection(INVOICES_COLLECTION).add(Object.assign({
          invoiceSeq: seq, invoiceNo: INVOICE_ID_PREFIX + seq
        }, rec));
        showToast(t('inv_saved'));
      }
      STATE.invDraft = null; STATE.invEditingId = null;
      render();
    }catch(e){
      console.warn('invoice save failed', e);
      showToast(t('inv_fail'));
    }finally{ saveBtn.disabled = false; }
  });

  // ---- list actions ----
  document.querySelectorAll('[data-invedit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const inv = STATE.invoices.find(i=>i.id===btn.dataset.invedit);
      if(!inv) return;
      STATE.invEditingId = inv.id;
      STATE.invDraft = {
        id: inv.id, invoiceNo: inv.invoiceNo || '', client: inv.client || '', genId: inv.genId || '',
        date: inv.date || todayStr(), dueDate: inv.dueDate || '', ref: inv.ref || '', notes: inv.notes || '',
        orderNo: inv.orderNo || '', contractNo: inv.contractNo || '', serialNo: inv.serialNo || '',
        lines: (inv.lines||[]).map(l=>Object.assign({}, l)),
        discount: inv.discount || 0, status: inv.status || 'draft',
        paidAmount: inv.paidAmount || 0, paidDate: inv.paidDate || ''
      };
      render();
      const top = document.getElementById('inv-client');
      if(top && top.scrollIntoView) top.scrollIntoView({ behavior:'smooth', block:'center' });
    });
  });

  document.querySelectorAll('[data-invpay]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const inv = STATE.invoices.find(i=>i.id===btn.dataset.invpay);
      if(!inv) return;
      const tt = invoiceTotals(inv);
      const answer = prompt(t('inv_payment_prompt'), String(tt.total));
      if(answer===null) return;
      const paid = round2(Math.max(0, parseFloat(answer)||0));
      try{
        await db.collection(INVOICES_COLLECTION).doc(inv.id).update({
          paidAmount: paid,
          paidDate: paid > 0 ? todayStr() : '',
          status: statusForPayment(inv, paid)
        });
        showToast(t('inv_updated'));
      }catch(e){ console.warn('payment update failed', e); showToast(t('inv_fail')); }
    });
  });

  document.querySelectorAll('[data-invstatus]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const inv = STATE.invoices.find(i=>i.id===btn.dataset.invstatus);
      if(!inv) return;
      const i = INVOICE_STATUS.indexOf(inv.status || 'draft');
      const next = INVOICE_STATUS[(i + 1) % INVOICE_STATUS.length];
      try{
        await db.collection(INVOICES_COLLECTION).doc(inv.id).update({ status: next });
        showToast(t('inv_updated'));
      }catch(e){ console.warn('status update failed', e); showToast(t('inv_fail')); }
    });
  });

  document.querySelectorAll('[data-invdel]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm(t('inv_del_confirm'))) return;
      try{
        await db.collection(INVOICES_COLLECTION).doc(btn.dataset.invdel).delete();
        showToast(t('inv_saved'));
      }catch(e){ console.warn('invoice delete failed', e); showToast(t('inv_fail')); }
    });
  });

  const chosenOpts = id => {
    const sc = document.querySelector(`[data-invscope="${id}"]`);
    const dt = document.querySelector(`[data-invdetail="${id}"]`);
    return { scope: sc ? sc.value : 'all', detail: dt ? dt.value : 'detailed' };
  };
  document.querySelectorAll('[data-invprint]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const o = chosenOpts(btn.dataset.invprint);
      printInvoice(btn.dataset.invprint, o.scope, o.detail);
    });
  });
  document.querySelectorAll('[data-invword]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const o = chosenOpts(btn.dataset.invword);
      exportInvoiceWord(btn.dataset.invword, o.scope, o.detail);
    });
  });
}

function printInvoice(id, scope, detail){
  const inv = STATE.invoices.find(x=>x.id===id);
  if(!inv) return;
  const bi = STATE.lang==='ar';
  const html = `<!DOCTYPE html><html lang="${bi?'ar':'en'}" dir="${bi?'rtl':'ltr'}"><head><meta charset="utf-8">
  <title>EnvironmSafe — ${t('inv_report_title')} ${escHtml(inv.invoiceNo||'')}</title>
  <style>
    @page { size: A4 portrait; margin: 12mm; }
    ${INVOICE_REPORT_CSS}
    @media print{.noprint{display:none;}}
    .noprint{position:fixed;top:8px;${bi?'left':'right'}:8px;background:#C49A2A;color:#1B2A4A;border:none;padding:10px 18px;border-radius:8px;font-weight:800;font-size:14px;cursor:pointer;}
  </style></head><body>
    <button class="noprint" onclick="window.print()">${bi?'🖨 طباعة / حفظ PDF':'🖨 Print / Save PDF'}</button>
    ${invoiceReportBody(inv, scope, detail)}
    <script>setTimeout(function(){window.print();}, 400);<\/script>
  </body></html>`;

  const w = window.open('', '_blank');
  if(!w){ showToast(bi?'⚠️ اسمح بالنوافذ المنبثقة':'⚠️ Allow pop-ups to export PDF'); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

function exportInvoiceWord(id, scope, detail){
  const inv = STATE.invoices.find(x=>x.id===id);
  if(!inv) return;
  const bi = STATE.lang==='ar';
  const html = `<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40" lang="${bi?'ar':'en'}" dir="${bi?'rtl':'ltr'}"><head><meta charset="utf-8">
  <title>EnvironmSafe — ${t('inv_report_title')} ${escHtml(inv.invoiceNo||'')}</title>
  <!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->
  <style>
    @page Section1 { size: 21cm 29.7cm; margin: 2cm; }
    div.Section1 { page: Section1; }
    ${INVOICE_REPORT_CSS}
  </style></head><body>
    <div class="Section1">${invoiceReportBody(inv, scope, detail)}</div>
  </body></html>`;

  const blob = new Blob(['﻿', html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const sfx = [scope && scope!=='all' ? scope : '', detail==='summary' ? 'summary' : ''].filter(Boolean).join('_');
  a.download = `EnvironmSafe_${(inv.invoiceNo||'Invoice').replace(/[^a-zA-Z0-9_-]+/g,'_')}${sfx?'_'+sfx:''}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(t('corr_word_downloaded'));
}

function bindPriceListEditor(){
  document.querySelectorAll('[data-pltoggle]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const i = priceItemById(btn.dataset.pltoggle);
      if(!i) return;
      try{
        await db.collection(PRICELIST_COLLECTION).doc(i.id).update({ active: i.active===false });
      }catch(e){ console.warn('toggle price item failed', e); showToast(t('inv_fail')); }
    });
  });

  document.querySelectorAll('[data-pledit]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const i = priceItemById(btn.dataset.pledit);
      if(!i) return;
      const name = prompt(t('pl_name_prompt'), priceItemLabel(i));
      if(name===null) return;
      const priceRaw = prompt(t('pl_price_prompt'), String(round2(i.unitPrice)));
      if(priceRaw===null) return;
      const patch = { unitPrice: round2(parseFloat(priceRaw)||0) };
      if(name.trim()){
        if(STATE.lang==='ar') patch.nameAr = name.trim(); else patch.nameEn = name.trim();
      }
      try{
        await db.collection(PRICELIST_COLLECTION).doc(i.id).update(patch);
        showToast(t('pl_added'));
      }catch(e){ console.warn('edit price item failed', e); showToast(t('inv_fail')); }
    });
  });

  document.querySelectorAll('[data-pldel]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm(t('pl_del_confirm'))) return;
      try{
        await db.collection(PRICELIST_COLLECTION).doc(btn.dataset.pldel).delete();
      }catch(e){ console.warn('delete price item failed', e); showToast(t('inv_fail')); }
    });
  });

  const addBtn = document.getElementById('pl-add');
  if(addBtn) addBtn.addEventListener('click', async ()=>{
    const nameAr = document.getElementById('pl-name-ar').value.trim();
    const nameEn = document.getElementById('pl-name-en').value.trim();
    if(!nameAr && !nameEn){ showToast(t('pl_need_name')); return; }
    const unit = document.getElementById('pl-unit').value.trim();
    const unitPrice = round2(parseFloat(document.getElementById('pl-price').value)||0);
    addBtn.disabled = true;
    try{
      await db.collection(PRICELIST_COLLECTION).add({
        nameAr, nameEn, unit, unitPrice, active: true,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      showToast(t('pl_added'));
      ['pl-name-ar','pl-name-en','pl-unit','pl-price'].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=''; });
    }catch(e){
      console.warn('add price item failed', e);
      showToast(t('inv_fail'));
    }finally{ addBtn.disabled = false; }
  });

  const billBtn = document.getElementById('bill-save');
  if(billBtn) billBtn.addEventListener('click', async ()=>{
    const val = id => { const e = document.getElementById(id); return e ? String(e.value||'').trim() : ''; };
    const rate = round2(parseFloat(val('bill-rate'))||0);
    const routine = round2(parseFloat(val('bill-routine'))||0);
    const currency = val('bill-currency') || DEFAULT_CURRENCY;
    billBtn.disabled = true;
    try{
      await db.collection(SETTINGS_COLLECTION).doc(BILLING_DOC).set({
        serviceRate: rate, routineRate: routine, currency,
        bank1Name: val('bill-bank1-name'), bank1Acct: val('bill-bank1-acct'),
        bank2Name: val('bill-bank2-name'), bank2Acct: val('bill-bank2-acct')
      }, { merge: true });
      showToast(t('bill_saved'));
    }catch(e){
      console.warn('billing settings save failed', e);
      showToast(t('inv_fail'));
    }finally{ billBtn.disabled = false; }
  });
}

/* ================= GENERATORS ================= */
/* ================= LABEL / TEXT CUSTOMIZATION ================= */
const LABEL_CATEGORY_PREFIXES = [
  ['tab_', 'cat_tabs'],
  ['title_', 'cat_tabheaders'],
  ['sub_', 'cat_tabheaders'],
  ['corr_', 'cat_faults'],
  ['inv_', 'cat_billing'],
  ['pl_', 'cat_billing'],
  ['bill_', 'cat_billing'],
  ['maint_', 'cat_maint'],
  ['svc_', 'cat_maint'],
  ['rep_', 'cat_reports'],
  ['f_', 'cat_readings'],
  ['col_', 'cat_readings'],
  ['ph_', 'cat_readings'],
  ['sec_', 'cat_readings'],
  ['warn_', 'cat_warnerr'],
  ['err_', 'cat_warnerr'],
];
const LABEL_CATEGORY_ORDER = ['cat_tabs','cat_tabheaders','cat_faults','cat_billing','cat_maint','cat_reports','cat_readings','cat_warnerr','cat_general'];

function categoryForLabelKey(key){
  for(const [prefix, cat] of LABEL_CATEGORY_PREFIXES){
    if(key.indexOf(prefix) === 0) return cat;
  }
  return 'cat_general';
}

function allLabelKeys(){
  const keys = new Set([...Object.keys(I18N.en||{}), ...Object.keys(I18N.ar||{})]);
  return Array.from(keys).sort();
}

function labelRow(key){
  const ov = STATE.labelOverrides[key] || {};
  const defAr = I18N.ar[key] || '';
  const defEn = I18N.en[key] || key;
  return `<div class="lbl-row">
    <div class="lbl-key">${key}</div>
    <input type="text" class="lbl-in" data-lblkey="${key}" data-lbllang="ar" placeholder="${escHtml(defAr)}" value="${escHtml(ov.ar||'')}">
    <input type="text" class="lbl-in" data-lblkey="${key}" data-lbllang="en" placeholder="${escHtml(defEn)}" value="${escHtml(ov.en||'')}">
  </div>`;
}

function renderLabelsEditor(){
  const cats = {};
  allLabelKeys().forEach(k=>{ const c = categoryForLabelKey(k); (cats[c]=cats[c]||[]).push(k); });
  const sections = LABEL_CATEGORY_ORDER.filter(c=>cats[c] && cats[c].length).map(c=>{
    const keys = cats[c];
    return `<details class="lbl-cat">
      <summary>${t(c)} (${keys.length})</summary>
      ${keys.map(labelRow).join('')}
    </details>`;
  }).join('');
  return `<div class="card">
    <h3>${t('labels_title')}</h3>
    <div class="hint">${t('labels_hint')}</div>
    <input type="text" id="lbl-search" placeholder="${t('labels_search_ph')}" style="margin-bottom:10px;">
    <div id="lbl-sections">${sections}</div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
      <button class="btn btn-primary" id="lbl-save">${t('labels_save')}</button>
      <button class="btn btn-outline" id="lbl-reset">${t('labels_reset')}</button>
    </div>
  </div>`;
}

function bindLabelsEditor(){
  const search = document.getElementById('lbl-search');
  if(search) search.addEventListener('input', ()=>{
    const q = search.value.trim().toLowerCase();
    document.querySelectorAll('.lbl-row').forEach(row=>{
      const inputs = row.querySelectorAll('.lbl-in');
      const key = row.querySelector('.lbl-key').textContent.toLowerCase();
      const hay = key + ' ' + inputs[0].placeholder.toLowerCase() + ' ' + inputs[1].placeholder.toLowerCase();
      row.style.display = (!q || hay.includes(q)) ? '' : 'none';
    });
    document.querySelectorAll('.lbl-cat').forEach(det=>{
      const anyVisible = Array.from(det.querySelectorAll('.lbl-row')).some(r=>r.style.display!=='none');
      if(q) det.open = true;
      det.style.display = (q && !anyVisible) ? 'none' : '';
    });
  });

  const saveBtn = document.getElementById('lbl-save');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    const overrides = {};
    document.querySelectorAll('.lbl-row').forEach(row=>{
      const key = row.querySelector('.lbl-key').textContent;
      const inputs = row.querySelectorAll('.lbl-in');
      const arVal = inputs[0].value.trim();
      const enVal = inputs[1].value.trim();
      if(arVal || enVal){
        overrides[key] = {};
        if(arVal) overrides[key].ar = arVal;
        if(enVal) overrides[key].en = enVal;
      }
    });
    saveBtn.disabled = true;
    try{
      await db.collection(SETTINGS_COLLECTION).doc('labels').set(overrides);
      showToast(t('labels_saved'));
    }catch(e){
      console.warn('label save failed', e);
      showToast(t('corr_fail'));
    }finally{ saveBtn.disabled = false; }
  });

  const resetBtn = document.getElementById('lbl-reset');
  if(resetBtn) resetBtn.addEventListener('click', async ()=>{
    if(!confirm(t('labels_reset_confirm'))) return;
    try{
      await db.collection(SETTINGS_COLLECTION).doc('labels').set({});
      showToast(t('labels_reset_done'));
    }catch(e){
      console.warn('label reset failed', e);
      showToast(t('corr_fail'));
    }
  });
}

/* ================= CUSTOM FIELDS (user-defined extra fields per form) ================= */
const CF_SECTIONS = ['reading', 'corrective', 'service', 'generator'];
const CF_TYPES = ['text', 'textarea', 'number', 'date', 'select'];

function cfSectionLabel(s){ return t('cf_section_' + s); }
function cfLabel(f){ return STATE.lang==='ar' ? (f.labelAr || f.labelEn || f.key) : (f.labelEn || f.labelAr || f.key); }

function customFieldsFor(section){
  return STATE.customFields.filter(f => f.section === section && f.active !== false);
}

function renderCustomFieldInputs(section, existingValues, idPrefix){
  const fields = customFieldsFor(section);
  if(!fields.length) return '';
  const vals = existingValues || {};
  return fields.map(f=>{
    const val = (vals[f.key]!==undefined && vals[f.key]!==null) ? vals[f.key] : '';
    const id = `${idPrefix}-${f.key}`;
    let input;
    if(f.type==='textarea') input = `<textarea id="${id}" rows="2" placeholder="—">${escHtml(val)}</textarea>`;
    else if(f.type==='number') input = `<input type="number" step="0.1" id="${id}" value="${escHtml(val)}" placeholder="—">`;
    else if(f.type==='date') input = `<input type="date" id="${id}" value="${escHtml(val)}">`;
    else if(f.type==='select'){
      const opts = (f.options||[]).map(o=>`<option value="${escHtml(o)}"${o===val?' selected':''}>${escHtml(o)}</option>`).join('');
      input = `<select id="${id}"><option value="">—</option>${opts}</select>`;
    }
    else input = `<input type="text" id="${id}" value="${escHtml(val)}" placeholder="—">`;
    return `<label>${escHtml(cfLabel(f))}</label>${input}`;
  }).join('');
}

function collectCustomFieldValues(section, idPrefix){
  const fields = customFieldsFor(section);
  const out = {};
  fields.forEach(f=>{
    const e = document.getElementById(`${idPrefix}-${f.key}`);
    if(e && e.value!==''){ out[f.key] = e.value; }
  });
  return out;
}

function promptCustomFieldValues(section){
  const fields = customFieldsFor(section);
  if(!fields.length) return {};
  const out = {};
  fields.forEach(f=>{
    const v = prompt(cfLabel(f), '');
    if(v!==null && v.trim()!==''){ out[f.key] = v.trim(); }
  });
  return out;
}

function renderCustomFieldValues(section, values){
  if(!values) return '';
  const fields = customFieldsFor(section);
  return fields
    .filter(f => values[f.key]!==undefined && values[f.key]!==null && values[f.key]!=='')
    .map(f=>`<div style="font-size:12px;margin-top:3px;color:var(--muted);"><b>${escHtml(cfLabel(f))}:</b> ${escHtml(values[f.key])}</div>`)
    .join('');
}

// Flattened "key: value; key2: value2" summary for table-style exports (CSV/Excel/PDF)
function customFieldsSummary(section, values){
  if(!values) return '';
  const fields = customFieldsFor(section);
  return fields
    .filter(f => values[f.key]!==undefined && values[f.key]!==null && values[f.key]!=='')
    .map(f => `${cfLabel(f)}: ${values[f.key]}`)
    .join('; ');
}

function renderCustomFieldsEditor(){
  const bySection = {};
  STATE.customFields.forEach(f=>{ (bySection[f.section]=bySection[f.section]||[]).push(f); });
  const listHtml = CF_SECTIONS.map(s=>{
    const fields = bySection[s] || [];
    if(!fields.length) return '';
    const rows = fields.map(f=>{
      const inactive = f.active===false;
      return `<div class="cf-row${inactive?' cf-inactive':''}">
        <div class="cf-row-label">${escHtml(cfLabel(f))} <span class="cf-type">(${t('cf_type_'+f.type)})</span>${inactive?` <span class="cf-inactive-tag">${t('cf_inactive')}</span>`:''}</div>
        <div class="cf-row-actions">
          <button class="btn btn-outline btn-sm" data-cftoggle="${f.id}">${inactive?t('cf_activate'):t('cf_deactivate')}</button>
          <button class="btn btn-danger btn-sm" data-cfdel="${f.id}">${t('cf_delete')}</button>
        </div>
      </div>`;
    }).join('');
    return `<div class="cf-section"><h4>${cfSectionLabel(s)}</h4>${rows}</div>`;
  }).join('');

  const sectionOptions = CF_SECTIONS.map(s=>`<option value="${s}">${cfSectionLabel(s)}</option>`).join('');
  const typeOptions = CF_TYPES.map(ty=>`<option value="${ty}">${t('cf_type_'+ty)}</option>`).join('');

  return `<div class="card">
    <h3>${t('customfields_title')}</h3>
    <div class="hint">${t('customfields_hint')}</div>
    ${listHtml || `<div class="hint">${t('cf_none')}</div>`}
    <label>${t('cf_section')}</label>
    <select id="cf-section">${sectionOptions}</select>
    <div class="grid2">
      <div><label>${t('cf_label_ar')}</label><input type="text" id="cf-label-ar" placeholder="—"></div>
      <div><label>${t('cf_label_en')}</label><input type="text" id="cf-label-en" placeholder="—"></div>
    </div>
    <label>${t('cf_type')}</label>
    <select id="cf-type">${typeOptions}</select>
    <div id="cf-options-wrap" style="display:none;">
      <label>${t('cf_options')}</label>
      <input type="text" id="cf-options" placeholder="A, B, C">
    </div>
    <button class="btn btn-primary" id="cf-add" style="margin-top:12px;">${t('cf_add')}</button>
  </div>`;
}

function bindCustomFieldsEditor(){
  const typeSel = document.getElementById('cf-type');
  const optWrap = document.getElementById('cf-options-wrap');
  if(typeSel) typeSel.addEventListener('change', ()=>{
    optWrap.style.display = typeSel.value==='select' ? '' : 'none';
  });

  document.querySelectorAll('[data-cftoggle]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const f = STATE.customFields.find(x=>x.id===btn.dataset.cftoggle);
      if(!f) return;
      try{
        await db.collection(CUSTOMFIELDS_COLLECTION).doc(f.id).update({ active: f.active===false ? true : false });
      }catch(e){ console.warn('toggle custom field failed', e); showToast(t('corr_fail')); }
    });
  });

  document.querySelectorAll('[data-cfdel]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm(t('cf_delete_confirm'))) return;
      try{
        await db.collection(CUSTOMFIELDS_COLLECTION).doc(btn.dataset.cfdel).delete();
      }catch(e){ console.warn('delete custom field failed', e); showToast(t('corr_fail')); }
    });
  });

  const addBtn = document.getElementById('cf-add');
  if(addBtn) addBtn.addEventListener('click', async ()=>{
    const section = document.getElementById('cf-section').value;
    const labelAr = document.getElementById('cf-label-ar').value.trim();
    const labelEn = document.getElementById('cf-label-en').value.trim();
    if(!labelAr && !labelEn){ showToast(t('cf_need_label')); return; }
    const type = document.getElementById('cf-type').value;
    const optionsRaw = document.getElementById('cf-options').value.trim();
    const options = type==='select' ? optionsRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
    const key = 'cf_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    addBtn.disabled = true;
    try{
      await db.collection(CUSTOMFIELDS_COLLECTION).add({
        section, key, labelAr, labelEn, type, options, active: true,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      showToast(t('cf_added'));
      ['cf-label-ar','cf-label-en','cf-options'].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=''; });
    }catch(e){
      console.warn('add custom field failed', e);
      showToast(t('corr_fail'));
    }finally{ addBtn.disabled = false; }
  });
}

function renderGenerators(){
  const rows = STATE.generators.map(g=>{
    const count = STATE.readings.filter(r=>r.genId===g.id).length;
    return `<div class="genrow">
      <div class="genrow-top">
        <span class="badge ${g.client==='UNHCR'?'badge-unhcr':'badge-fao'}">${g.client}</span>
        <div class="gname">${g.name}</div>
        <div class="gcount">${count} ${t('readings_lbl')}</div>
      </div>
      ${renderCustomFieldValues('generator', g.customFields)}
      <div class="genrow-actions">
        <button class="btn btn-outline btn-sm" data-rename="${g.id}">${t('rename')}</button>
        <button class="btn btn-danger btn-sm" data-remove="${g.id}">${t('remove')}</button>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="card">
    <h3>${t('your_gens',{n:STATE.generators.length})}</h3>
    ${rows || `<div class="hint">${t('no_gens')}</div>`}
  </div>
  <div class="card">
    <h3>${t('add_gen')}</h3>
    <label class="req">${t('gen_name')}</label>
    <input type="text" id="ng-name" placeholder="UNHCR Genset 6">
    <label class="req">${t('gen_client')}</label>
    <select id="ng-client">
      <option value="UNHCR">UNHCR</option>
      <option value="FAO">FAO</option>
      <option value="Other">${t('client_other')}</option>
    </select>
    ${renderCustomFieldInputs('generator', null, 'ng')}
    <button class="btn btn-primary" id="addGenBtn">${t('add_gen_btn')}</button>
  </div>
  <div class="card">
    <h3>${t('data_sync')}</h3>
    <div class="hint">${t('data_sync_body')}</div>
  </div>
  <div class="card">
    <h3>${t('thresholds')}</h3>
    <div class="hint">
      Voltage 360–420 V · Frequency 49–51 Hz · Oil pressure 2–7 bar ·
      Coolant ≤ 98°C · Oil temp ≤ 110°C · Battery 23–29 V · Fuel ≥ 15%
    </div>
  </div>
  <div class="card">
    <h3>EnvironmSafe</h3>
    <div class="hint">
      ${t('company_line')}<br>
      support@environmsafe.com · +967 78 340 2932 · www.environmsafe.com
    </div>
  </div>
  ${renderBillingSettings()}
  ${renderPriceListEditor()}
  ${renderCustomFieldsEditor()}
  ${renderLabelsEditor()}
  `;
}

function bindGenerators(){
  bindLabelsEditor();
  bindCustomFieldsEditor();
  bindPriceListEditor();

  document.getElementById('addGenBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('ng-name').value.trim();
    const client = document.getElementById('ng-client').value;
    if(!name){ showToast(t('warn_genname')); return; }
    const customFields = collectCustomFieldValues('generator', 'ng');
    try{
      await db.collection(GENERATORS_COLLECTION).add({ name, client, ...(Object.keys(customFields).length ? {customFields} : {}) });
      showToast(t('added'));
    }catch(e){
      console.warn('add generator failed', e);
      showToast(t('add_fail'));
    }
  });

  document.querySelectorAll('[data-rename]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const g = genById(btn.dataset.rename);
      const newName = prompt(t('rename_prompt'), g.name);
      if(newName && newName.trim()){
        try{
          await db.collection(GENERATORS_COLLECTION).doc(g.id).update({ name: newName.trim() });
        }catch(e){
          console.warn('rename failed', e);
          showToast(t('rename_fail'));
        }
      }
    });
  });

  document.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const g = genById(btn.dataset.remove);
      const count = STATE.readings.filter(r=>r.genId===g.id).length;
      const msg = count ? t('remove_confirm_n',{n:count}) : t('remove_confirm',{name:g.name});
      if(!confirm(msg)) return;
      try{
        await db.collection(GENERATORS_COLLECTION).doc(g.id).delete();
        showToast(t('removed'));
      }catch(e){
        console.warn('remove failed', e);
        showToast(t('remove_fail'));
      }
    });
  });
}

// Language toggle wiring
document.querySelectorAll('[data-lang]').forEach(btn=>{
  btn.addEventListener('click', ()=> setLang(btn.dataset.lang));
});

// Initialize language (Arabic default) before first render
STATE.lang = getLang();
applyLangChrome();

init();
